
name: Build Music Note Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android Project
        run: |
          mkdir -p project
          unzip -q "MusicNoteMaker_Android_Project(3).zip" -d project
          echo "Extract completed"
          find project -type f -name gradlew -print

      - name: Build APK
        run: |
          WRAPPER=$(find project -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=$(find project -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is too small"
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Note-Maker-APK
          path: output/app-debug.apk
          if-no-files-found: error
